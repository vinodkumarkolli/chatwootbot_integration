[project]
name = "chatwootbot_integration"
authors = [{ name = "Vinod Kumar K", email = "vinodkumarkolli@gmail.com" }]
description = "ERPNext side of the Swarna WhatsApp chatbot (Chatwoot) integration: Trial Orders on Frappe CRM"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.format]
indent-style = "tab"
quote-style = "double"
